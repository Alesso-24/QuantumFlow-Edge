name: Deploy — Demo online (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["multiplatform-app/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Habilitar GitHub Pages si no existe
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: multiplatform-app/package-lock.json
      - name: Instalar dependencias
        working-directory: multiplatform-app
        run: npm ci
      - name: Exportar build web estático
        working-directory: multiplatform-app
        run: npx expo export --platform web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: multiplatform-app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
