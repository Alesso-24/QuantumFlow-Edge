name: Deploy — Demo online (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["multiplatform-app/**", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: multiplatform-app/package-lock.json
      - name: Instalar dependencias
        working-directory: multiplatform-app
        run: npm ci
      - name: Exportar build web estático
        working-directory: multiplatform-app
        run: npx expo export --platform web
      - name: Publicar en rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: multiplatform-app/dist
