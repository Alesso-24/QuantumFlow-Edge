name: Build — APK Android

on:
  push:
    branches: [main]
    paths: ["multiplatform-app/**", ".github/workflows/build-android.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: multiplatform-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        working-directory: multiplatform-app
        run: npm ci

      - name: Generar proyecto nativo Android (expo prebuild)
        working-directory: multiplatform-app
        run: npx expo prebuild --platform android --no-install

      - name: Compilar APK release (firma debug, instalable para demo)
        working-directory: multiplatform-app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Renombrar APK
        run: |
          cp multiplatform-app/android/app/build/outputs/apk/release/app-release.apk \
             QuantumFlowEdge.apk

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuantumFlowEdge-APK
          path: QuantumFlowEdge.apk

      - name: Publicar Release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: QuantumFlowEdge.apk
          generate_release_notes: true
