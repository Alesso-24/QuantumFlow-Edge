name: CI — Tests del core

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quantum-core:
    name: Optimizador QUBO (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias mínimas
        run: pip install numpy fastapi httpx
      - name: Smoke test del optimizador
        working-directory: backend-quantum
        run: python -m quantum.qubo_optimizer

  web-solver:
    name: Solver QUBO del cliente (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: multiplatform-app/package-lock.json
      - name: Instalar dependencias
        working-directory: multiplatform-app
        run: npm ci
      - name: Paridad con el core Python + invariante de suministro
        working-directory: multiplatform-app
        run: npx -y tsx solver-check.ts

  e2e-backend:
    name: E2E — core + WebSocket + fuga + QUBO
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependencias
        run: pip install fastapi "uvicorn[standard]" numpy pydantic httpx websockets
      - name: Levantar el core y correr la prueba end-to-end
        working-directory: backend-quantum
        run: |
          uvicorn main:app --port 8000 &
          for i in $(seq 1 30); do curl -fs http://localhost:8000/health && break; sleep 1; done
          python test_e2e.py

  edge-node-cpp:
    name: Nodo Edge embebido (C++17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar y ejecutar detector de anomalías
        working-directory: edge-ai-nodes
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ./build/edge_node | tail -5
          # La fuga inyectada en t>=80 DEBE detectarse
          ./build/edge_node | awk -F, 'NR>1 && $1>=90 && $4==1 {found=1} END {exit !found}'
